<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=index.html">
    <title>UtiliSave Issue Review System</title>
</head>
<body>
    <!--
        This file used to be a full duplicate copy of index.html, kept around
        so old bookmarks/emails pointing at "phase1_app.html" would still
        work. Maintaining two copies of a 2,500+ line form in lockstep is
        exactly how things drift out of sync — most recently, this file was
        still offering a free-text, unlocked Auditor Name field after
        index.html was changed to lock that field to the signed-in account,
        which would have silently defeated that fix for anyone using the old
        link. A redirect can't drift: whatever index.html does, this does.
    -->
    <p>Redirecting to <a href="index.html">the current form</a>&hellip;</p>
    <script>window.location.replace('index.html');</script>
</body>
</html>
